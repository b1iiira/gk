<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Nachrichten-Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid font-bold text-xl text-white">GK</i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">Nachrichten-Dashboard</h1>
                    <p class="text-xs text-slate-400">Aktuelle Eilmeldungen & Tagesschau News</p>
                </div>
            </div>

            <!-- Search & Refresh Controls -->
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInput" placeholder="Artikel suchen..." 
                           class="w-full bg-slate-900 text-sm border border-slate-700 rounded-lg pl-9 pr-4 py-2 focus:outline-none focus:border-blue-500 transition text-slate-200 placeholder-slate-500">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-500 text-sm"></i>
                </div>
                <button id="refreshBtn" onclick="loadNews()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 shadow-md shrink-0">
                    <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
                    <span>Aktualisieren</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        <!-- Status / Filter Info -->
        <div class="flex justify-between items-center mb-6">
            <div id="statusText" class="text-sm text-slate-400 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Live-Daten geladen
            </div>
            <div id="itemCount" class="text-xs font-semibold text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                0 Artikel
            </div>
        </div>

        <!-- News Grid -->
        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Skeletons -->
            <div class="animate-pulse bg-slate-800 rounded-2xl border border-slate-700/50 p-4 space-y-4">
                <div class="bg-slate-700 h-48 rounded-xl"></div>
                <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-700 rounded w-full"></div>
                <div class="h-3 bg-slate-700 rounded w-5/6"></div>
            </div>
            <div class="animate-pulse bg-slate-800 rounded-2xl border border-slate-700/50 p-4 space-y-4">
                <div class="bg-slate-700 h-48 rounded-xl"></div>
                <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-700 rounded w-full"></div>
                <div class="h-3 bg-slate-700 rounded w-5/6"></div>
            </div>
            <div class="animate-pulse bg-slate-800 rounded-2xl border border-slate-700/50 p-4 space-y-4">
                <div class="bg-slate-700 h-48 rounded-xl"></div>
                <div class="h-4 bg-slate-700 rounded w-3/4"></div>
                <div class="h-3 bg-slate-700 rounded w-full"></div>
                <div class="h-3 bg-slate-700 rounded w-5/6"></div>
            </div>
        </div>

        <!-- Modal for Detailed View -->
        <div id="articleModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col">
                <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-900 text-slate-300 hover:text-white rounded-full p-2 transition z-10">
                    <i class="fa-solid fa-xmark text-lg w-5 h-5 flex items-center justify-center"></i>
                </button>
                <div id="modalContent" class="p-6 space-y-4">
                    <!-- Dynamic Modal Content -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 mt-12 text-center text-slate-500 text-xs">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2026 GK Nachrichten-Dashboard. Daten bereitgestellt durch die Tagesschau API.</p>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const API_URL = 'https://www.tagesschau.de/api2u/news/';
        let allArticles = [];

        async function loadNews() {
            const refreshIcon = document.getElementById('refreshIcon');
            const newsGrid = document.getElementById('newsGrid');
            const statusText = document.getElementById('statusText');
            
            refreshIcon.classList.add('fa-spin');
            statusText.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span> Aktualisiere...`;

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Netzwerkfehler beim Laden der Daten.');
                
                const data = await response.json();
                allArticles = data.news || [];
                
                renderNews(allArticles);
                statusText.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Aktualisiert: ${new Date().toLocaleTimeString('de-DE')}`;
            } catch (error) {
                console.error('Fehler:', error);
                statusText.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Fehler beim Laden der Nachrichten.`;
                newsGrid.innerHTML = `
                    <div class="col-span-full bg-slate-800/50 border border-rose-500/30 rounded-2xl p-8 text-center text-slate-400">
                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-4xl mb-3"></i>
                        <p class="font-medium text-slate-200">Nachrichten konnten nicht geladen werden.</p>
                        <p class="text-xs mt-1">Bitte prüfe deine Internetverbindung oder versuche es später noch einmal.</p>
                    </div>
                `;
            } finally {
                refreshIcon.classList.remove('fa-spin');
            }
        }

        function renderNews(articles) {
            const newsGrid = document.getElementById('newsGrid');
            const itemCount = document.getElementById('itemCount');
            
            itemCount.textContent = `${articles.length} Artikel`;

            if (articles.length === 0) {
                newsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        Keine Artikel gefunden.
                    </div>
                `;
                return;
            }

            newsGrid.innerHTML = articles.map((item, index) => {
                const imageUrl = item.teaserImage?.imageVariants?.['16x9-640'] || 'https://via.placeholder.com/640x360?text=Kein+Bild';
                const date = item.date ? new Date(item.date).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : 'Unbekanntes Datum';
                const tag = item.topline || 'Nachrichten';
                const title = item.title || 'Ohne Titel';
                const description = getExtendedDescription(item);

                return `
                    <article class="bg-slate-800/90 rounded-2xl border border-slate-700/60 overflow-hidden hover:border-slate-600 transition-all hover:shadow-xl hover:-translate-y-1 flex flex-col group">
                        <div class="relative overflow-hidden aspect-video bg-slate-950">
                            <img src="${imageUrl}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-3 left-3 bg-blue-600/90 backdrop-blur-md text-white text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md shadow-md">
                                ${tag}
                            </span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="text-xs text-slate-400 flex items-center space-x-2 mb-2">
                                <i class="fa-regular fa-clock text-slate-500"></i>
                                <span>${date}</span>
                            </div>
                            <h2 class="font-bold text-lg text-slate-100 mb-3 group-hover:text-blue-400 transition line-clamp-2">
                                ${title}
                            </h2>
                            <p class="text-slate-400 text-sm mb-4 line-clamp-3 flex-grow leading-relaxed">
                                ${description}
                            </p>
                            <div class="pt-4 border-t border-slate-700/50 flex justify-between items-center">
                                <button onclick="openModal(${index})" class="text-blue-400 hover:text-blue-300 text-xs font-semibold flex items-center space-x-1 transition">
                                    <span>Vollständige Beschreibung</span>
                                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                </button>
                                ${item.detailsweb ? `
                                    <a href="${item.detailsweb}" target="_blank" class="text-slate-500 hover:text-slate-300 text-xs transition" title="Auf Tagesschau.de öffnen">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function getExtendedDescription(item) {
            // Extrahiere aus mehreren Feldern, um die Beschreibung zu erweitern
            let text = '';
            if (item.firstSentence) text += item.firstSentence + ' ';
            
            if (item.content) {
                const textContent = item.content
                    .filter(c => c.type === 'text' && c.value)
                    .map(c => c.value.replace(/<[^>]*>?/gm, ''))
                    .join(' ');
                text += textContent;
            }

            return text.trim() || 'Keine erweiterte Beschreibung verfügbar.';
        }

        function openModal(index) {
            const item = allArticles[index];
            if (!item) return;

            const modalContent = document.getElementById('modalContent');
            const imageUrl = item.teaserImage?.imageVariants?.['16x9-960'] || 'https://via.placeholder.com/960x540?text=Kein+Bild';
            const date = item.date ? new Date(item.date).toLocaleString('de-DE', { dateStyle: 'full', timeStyle: 'short' }) : 'Unbekanntes Datum';
            const extendedDesc = getExtendedDescription(item);

            modalContent.innerHTML = `
                <div class="space-y-4">
                    <span class="inline-block bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs font-semibold px-2.5 py-1 rounded-full">
                        ${item.topline || 'Nachrichten'}
                    </span>
                    <h2 class="text-2xl font-bold text-white leading-tight">${item.title}</h2>
                    <div class="text-xs text-slate-400 flex items-center space-x-2">
                        <i class="fa-regular fa-clock"></i>
                        <span>${date}</span>
                    </div>
                    <div class="rounded-xl overflow-hidden my-4 bg-slate-950 aspect-video">
                        <img src="${imageUrl}" alt="${item.title}" class="w-full h-full object-cover">
                    </div>
                    <div class="text-slate-300 leading-relaxed text-sm space-y-3">
                        <p class="font-medium text-slate-200">${item.firstSentence || ''}</p>
                        <p class="whitespace-pre-line">${extendedDesc}</p>
                    </div>
                    <div class="pt-6 border-t border-slate-700 flex justify-end gap-3">
                        <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition">
                            Schließen
                        </button>
                        ${item.detailsweb ? `
                            <a href="${item.detailsweb}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                                <span>Original-Artikel öffnen</span>
                                <i class="fa-solid fa-external-link text-xs"></i>
                            </a>
                        ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('articleModal').classList.remove('hidden');
            document.getElementById('articleModal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('articleModal').classList.add('hidden');
            document.getElementById('articleModal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allArticles.filter(item => {
                const title = (item.title || '').toLowerCase();
                const topline = (item.topline || '').toLowerCase();
                const desc = getExtendedDescription(item).toLowerCase();
                return title.includes(query) || topline.includes(query) || desc.includes(query);
            });
            renderNews(filtered);
        });

        // Close Modal on Outside Click
        document.getElementById('articleModal').addEventListener('click', (e) => {
            if (e.target.id === 'articleModal') closeModal();
        });

        // Initial Load
        loadNews();
    </script>
</body>
</html>
